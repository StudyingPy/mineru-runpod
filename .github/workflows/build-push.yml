name: Build and Push to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build (for example, 1.8.0)"
        required: true
        default: "1.8.0"
        type: string
      promote_latest:
        description: "Also update latest after validation"
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/v}"
          else
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then
            echo "Image tag is empty" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "tags<<EOF"
            echo "$DOCKERHUB_USERNAME/mineru-runpod:$tag"
            if [ "${{ inputs.promote_latest }}" = "true" ]; then
              echo "$DOCKERHUB_USERNAME/mineru-runpod:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mineru-runpod:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mineru-runpod:buildcache,mode=max
